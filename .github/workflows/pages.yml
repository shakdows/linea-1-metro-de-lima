name: Desplegar en GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        working-directory: web
        run: npm ci

      - name: Construir la aplicación
        working-directory: web
        # En GitHub Pages el sitio cuelga de /<repo>/, no de la raíz del dominio
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Reajustar la versión anterior al subdirectorio de Pages
        # `public/anterior/` es una copia ya construida: sus rutas se fijaron
        # para un dominio servido desde la raíz (Vercel). En Pages el sitio
        # cuelga de /<repo>/, así que hay que anteponerlo. El cambio se limita
        # a esa carpeta, no toca la aplicación actual.
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          grep -rlZ -e '/anterior/' -e '/estaciones/' -e '/img/' web/out/anterior \
            | xargs -0 --no-run-if-empty sed -i \
                -e "s#\"/anterior/#\"$BASE_PATH/anterior/#g" \
                -e "s#\"/estaciones/#\"$BASE_PATH/estaciones/#g" \
                -e "s#\"/img/#\"$BASE_PATH/img/#g"

      - name: Preparar la publicación
        # GitHub Pages ignora las carpetas que empiezan por guion bajo (_next)
        run: touch web/out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
