<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Ilustración de un tren de la Línea 1 circulando por un viaducto elevado sobre Lima">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeee4"/>
      <stop offset="55%" stop-color="#eef6f1"/>
      <stop offset="100%" stop-color="#f7f9f8"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="62%" stop-color="#f4f7f5"/>
      <stop offset="100%" stop-color="#dfe6e2"/>
    </linearGradient>
    <linearGradient id="franja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b544"/>
      <stop offset="100%" stop-color="#009b3a"/>
    </linearGradient>
    <linearGradient id="ventana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c4a41"/>
      <stop offset="100%" stop-color="#16302a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#cielo)"/>

  <!-- Cordillera -->
  <path d="M0 372 L128 258 L214 322 L318 214 L426 330 L512 268 L612 352 L700 300 L812 386 L900 330 L1024 404 L1120 356 L1200 410 L1200 520 L0 520 Z" fill="#c9ded3" opacity=".62"/>
  <path d="M0 424 L96 360 L206 418 L320 344 L432 424 L548 372 L664 440 L782 386 L902 452 L1030 400 L1140 456 L1200 430 L1200 540 L0 540 Z" fill="#b4d3c3" opacity=".55"/>

  <!-- Ciudad -->
  <g fill="#a8c9b8" opacity=".68">
    <rect x="42" y="430" width="74" height="132" rx="4"/>
    <rect x="130" y="466" width="56" height="96" rx="4"/>
    <rect x="200" y="404" width="88" height="158" rx="4"/>
    <rect x="302" y="452" width="62" height="110" rx="4"/>
    <rect x="378" y="420" width="80" height="142" rx="4"/>
    <rect x="474" y="474" width="58" height="88" rx="4"/>
    <rect x="548" y="436" width="86" height="126" rx="4"/>
    <rect x="650" y="462" width="64" height="100" rx="4"/>
    <rect x="730" y="414" width="92" height="148" rx="4"/>
    <rect x="838" y="458" width="60" height="104" rx="4"/>
    <rect x="914" y="430" width="84" height="132" rx="4"/>
    <rect x="1014" y="470" width="66" height="92" rx="4"/>
    <rect x="1096" y="440" width="78" height="122" rx="4"/>
  </g>
  <g fill="#f7f9f8" opacity=".5">
    <rect x="56" y="448" width="12" height="16" rx="2"/><rect x="78" y="448" width="12" height="16" rx="2"/>
    <rect x="216" y="424" width="12" height="16" rx="2"/><rect x="240" y="424" width="12" height="16" rx="2"/>
    <rect x="264" y="424" width="12" height="16" rx="2"/><rect x="394" y="440" width="12" height="16" rx="2"/>
    <rect x="418" y="440" width="12" height="16" rx="2"/><rect x="746" y="434" width="12" height="16" rx="2"/>
    <rect x="770" y="434" width="12" height="16" rx="2"/><rect x="794" y="434" width="12" height="16" rx="2"/>
    <rect x="930" y="450" width="12" height="16" rx="2"/><rect x="954" y="450" width="12" height="16" rx="2"/>
  </g>

  <!-- Palmeras -->
  <g stroke="#8fbda4" stroke-width="5" stroke-linecap="round" fill="none" opacity=".75">
    <path d="M108 700 q4 -48 2 -76"/><path d="M110 624 q-30 -6 -44 12"/><path d="M110 624 q28 -10 46 8"/><path d="M110 624 q-12 -26 -34 -30"/><path d="M110 624 q16 -24 40 -24"/>
    <path d="M1082 712 q5 -52 3 -82"/><path d="M1085 630 q-32 -6 -46 14"/><path d="M1085 630 q30 -10 48 8"/><path d="M1085 630 q-12 -28 -36 -32"/>
  </g>

  <!-- Viaducto elevado -->
  <g>
    <rect x="0" y="612" width="1200" height="30" fill="#d6ded9"/>
    <rect x="0" y="642" width="1200" height="12" fill="#c2cdc7"/>
    <g fill="#ccd6d0">
      <rect x="128" y="654" width="52" height="146" rx="5"/>
      <rect x="436" y="654" width="52" height="146" rx="5"/>
      <rect x="744" y="654" width="52" height="146" rx="5"/>
      <rect x="1052" y="654" width="52" height="146" rx="5"/>
    </g>
  </g>

  <!-- Tren -->
  <g>
    <!-- sombra -->
    <ellipse cx="640" cy="614" rx="472" ry="11" fill="#16302a" opacity=".1"/>

    <!-- vagón trasero (parcial) -->
    <rect x="176" y="404" width="292" height="200" rx="26" fill="url(#cuerpo)"/>
    <rect x="176" y="520" width="292" height="26" fill="url(#franja)"/>
    <g fill="url(#ventana)">
      <rect x="204" y="438" width="74" height="60" rx="11"/>
      <rect x="292" y="438" width="74" height="60" rx="11"/>
      <rect x="380" y="438" width="62" height="60" rx="11"/>
    </g>
    <rect x="458" y="404" width="16" height="200" fill="#c3ccc8"/>

    <!-- vagón delantero -->
    <path d="M474 430 q0 -26 26 -26 h480 q66 0 104 54 l30 44 q10 16 10 34 v44 q0 24 -24 24 h-600 q-26 0 -26 -26 Z" fill="url(#cuerpo)"/>
    <path d="M474 520 h654 v26 h-654 Z" fill="url(#franja)"/>
    <path d="M980 404 q66 0 104 54 l30 44 q10 16 10 34 h-144 Z" fill="#00b544" opacity=".92"/>

    <!-- ventanas laterales -->
    <g fill="url(#ventana)">
      <rect x="508" y="438" width="74" height="60" rx="11"/>
      <rect x="596" y="438" width="74" height="60" rx="11"/>
      <rect x="684" y="438" width="74" height="60" rx="11"/>
      <rect x="772" y="438" width="74" height="60" rx="11"/>
      <rect x="860" y="438" width="74" height="60" rx="11"/>
    </g>
    <!-- parabrisas -->
    <path d="M962 438 h44 q40 0 62 36 l14 24 h-120 q-10 0 -10 -10 v-40 q0 -10 10 -10 Z" fill="url(#ventana)"/>

    <!-- puertas -->
    <g fill="#e7ecea" opacity=".85">
      <rect x="586" y="404" width="6" height="142"/>
      <rect x="762" y="404" width="6" height="142"/>
    </g>

    <!-- faros -->
    <rect x="1104" y="556" width="34" height="14" rx="7" fill="#fff3c9"/>
    <rect x="1104" y="556" width="34" height="14" rx="7" fill="#f5b82e" opacity=".55"/>

    <!-- bogies -->
    <g fill="#8a9a93">
      <rect x="232" y="604" width="104" height="16" rx="8"/>
      <rect x="376" y="604" width="104" height="16" rx="8"/>
      <rect x="560" y="604" width="104" height="16" rx="8"/>
      <rect x="880" y="604" width="104" height="16" rx="8"/>
    </g>

    <!-- número de línea -->
    <circle cx="1040" cy="500" r="17" fill="#009b3a"/>
    <path d="M1036 490 h7 v21 h-6 v-15 l-5 2 v-5 z" fill="#ffffff"/>
  </g>
</svg>
